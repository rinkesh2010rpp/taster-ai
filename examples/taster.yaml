# Example policy: rules only. Load with Policy.from_yaml("examples/taster.yaml")
# and give the detector(s) to the middleware or Screener.
rules:
  # Web search results: enforce once shadow logs look clean.
  - tool: search_web
    mode: enforce
    threshold: 0.85

  # Third-party MCP servers: stricter, judged by a detector registered as
  # "strict" (detectors={"strict": ...}), and blocked if it can't answer.
  - tool: "mcp_*"
    mode: enforce
    detector: strict
    unclear: withhold
    on_error: block

  # Shell commands, but only those that fetch from the internet.
  - tool: execute
    mode: shadow
    when_args:
      command: '\bcurl\b|\bwget\b|https?://|\bgit\s+(clone|pull|fetch)\b'

  # Everything else (local files, your own tools) is not screened.
  - tool: "*"
    mode: pass
