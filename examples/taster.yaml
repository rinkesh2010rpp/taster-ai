# Example checks. Load with TasterMiddleware.from_yaml("examples/taster.yaml")
# (or checks_from_yaml). Every check here is judged by Jev; build checks in
# Python to use another judge.
checks:
  # Prompt injection in what tools return.
  - check: injection
    scope:
      tool_result:
        # Web search results: enforce once shadow logs look clean.
        - tool: search_web
          mode: enforce
          threshold: 0.85

        # Third-party MCP servers: stricter, and blocked if it can't answer.
        - tool: "mcp_*"
          mode: enforce
          unclear: withhold
          on_error: block

        # Shell commands, but only those that fetch from the internet.
        - tool: execute
          mode: shadow
          when_args:
            command: '\bcurl\b|\bwget\b|https?://|\bgit\s+(clone|pull|fetch)\b'

        # Everything else (local files, your own tools) is not checked:
        # a tool no target matches is skipped.

  # Your rules, checked against every tool call before it runs.
  - check: constitution
    standard: |
      Never write secrets, API keys or tokens to files.
      Never send a secret to any host except the one that issued it.
      Never install skills or instruction files from external sources.
    scope:
      tool_call:
        - tool: "*"
          mode: shadow
