[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taster-ai"
version = "0.2.0.dev0"
description = "Your agent keeps your rules: checks every tool call against your plain-English constitution before it runs, and every tool result for prompt injection before the agent reads it."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Rinkesh" }]
keywords = ["ai-agents", "autonomous-agents", "constitution", "agent-rules", "guardrails", "prompt-injection", "llm-security", "langchain", "deepagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# The core has no dependencies; adapters and optional detectors come as extras.
dependencies = []

[project.optional-dependencies]
langchain = ["langchain>=1.0", "langchain-core>=1.0"]
deepagents = ["deepagents>=0.7", "langchain>=1.0", "langchain-core>=1.0"]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/taster_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
